[package]
name = "monitoring"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
metrics-exporter-dogstatsd = { workspace = true }
metrics = { workspace = true }
# Unused directly: vendors OpenSSL for `sentry`, as the runtime image has no libssl.
native-tls = { workspace = true }
sentry = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[package.metadata.cargo-machete]
# native-tls is a build-time-only dependency: it vendors OpenSSL for sentry's
# transport without appearing in monitoring's own code.
ignored = ["native-tls"]
