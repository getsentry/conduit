repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
    - id: check-case-conflict
    - id: check-executables-have-shebangs
    - id: check-merge-conflict
    - id: check-symlinks
    - id: end-of-file-fixer
      exclude_types: [svg]
      # Apache license boilerplate ships without a trailing newline.
      exclude: ^LICENSE\.md$
    - id: trailing-whitespace
      exclude_types: [svg]
    - id: check-added-large-files
      args: ['--maxkb=1024']

- repo: https://github.com/crate-ci/typos
  rev: v1.52.0
  hooks:
    - id: typos
      args: [--force-exclude]

- repo: https://github.com/rvben/rumdl-pre-commit
  rev: v0.3.2
  hooks:
    - id: rumdl-check

- repo: https://github.com/jdx/jactionlint
  rev: v2.5.0
  hooks:
    - id: jactionlint-shellcheck

- repo: https://github.com/EmbarkStudios/cargo-deny
  rev: 0.20.2
  hooks:
    - id: cargo-deny

- repo: https://github.com/agent-sh/agnix
  rev: v0.61.0
  hooks:
    - id: agnix
      args: [--strict]

- repo: local
  hooks:
    - id: rustfmt
      name: format rust code
      language: system
      types: [rust]
      # keep edition in sync with Cargo.toml
      # There is no way to run cargo fmt for specific files,
      # rustfmt can do it but doesn't read Cargo.toml.
      # https://github.com/rust-lang/rustfmt/issues/4485
      entry: rustfmt --edition=2024

    - id: hadolint
      name: dockerfile lint
      language: docker_image
      entry: ghcr.io/hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d hadolint
      types: [dockerfile]

    # jactionlint-shellcheck only lints shell blocks inside workflow YAML, so
    # standalone scripts need their own shellcheck hook.
    - id: shellcheck
      name: shell lint
      language: docker_image
      entry: docker.io/koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
      types: [shell]

- repo: https://github.com/bnjbvr/cargo-machete
  rev: v0.9.2
  hooks:
    - id: cargo-machete
