repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
    - id: check-case-conflict
    - id: check-executables-have-shebangs
    - id: check-merge-conflict
    - id: check-symlinks
    - id: end-of-file-fixer
      exclude_types: [svg]
      # Apache license boilerplate ships without a trailing newline.
      exclude: ^LICENSE\.md$
    - id: trailing-whitespace
      exclude_types: [svg]
    - id: check-added-large-files
      args: ['--maxkb=1024']

- repo: local
  hooks:
    - id: rustfmt
      name: format rust code
      language: system
      types: [rust]
      # keep edition in sync with Cargo.toml
      # There is no way to run cargo fmt for specific files,
      # rustfmt can do it but doesn't read Cargo.toml.
      # https://github.com/rust-lang/rustfmt/issues/4485
      entry: rustfmt --edition=2024

    - id: typos
      name: spell check
      language: system
      entry: typos
      pass_filenames: true

    - id: rumdl
      name: markdown lint
      language: system
      types: [markdown]
      entry: rumdl check

    - id: shellcheck
      name: shell lint
      language: system
      types: [shell]
      entry: shellcheck

    - id: hadolint
      name: dockerfile lint
      language: system
      files: (^|/)Dockerfile$
      entry: hadolint

    - id: jactionlint
      name: github actions lint
      language: system
      files: ^\.github/(workflows/[^/]+\.ya?ml|dependabot\.yml)$
      entry: jactionlint
      pass_filenames: false
