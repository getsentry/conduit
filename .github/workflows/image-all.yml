name: Unified Image Build
on:
  pull_request:
  push:
    branches:
      - main
      - release/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        include:
          - os: ubuntu-24.04
            platform: amd64
          - os: ubuntu-24.04-arm
            platform: arm64
    name: build-all-${{ matrix.platform }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Build and push image
        uses: getsentry/action-build-and-push-images@dd9b907092cdd2dbc6c1a409f7290df1b391f6ee
        with:
          image_name: "conduit"
          platforms: linux/${{ matrix.platform }}
          dockerfile_path: "./Dockerfile.all"
          ghcr: true
          tag_suffix: -${{ matrix.platform }}
          google_ar: false
          tag_nightly: false
          tag_latest: false

  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - run: docker login --username '${{ github.actor }}' --password-stdin ghcr.io <<< "$GHCR_TOKEN"
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Create multiplatform manifests for conduit
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/getsentry/conduit:${{ github.event.pull_request.head.sha || github.sha }} \
            --tag ghcr.io/getsentry/conduit:nightly \
            --tag ghcr.io/getsentry/conduit:latest \
            ghcr.io/getsentry/conduit:${{ github.event.pull_request.head.sha || github.sha }}-amd64 \
            ghcr.io/getsentry/conduit:${{ github.event.pull_request.head.sha || github.sha }}-arm64

# Copy manifest from GHCR to Google Artifact Registry, referenced Relay (https://github.com/getsentry/relay/blob/21c2e18ebe6f834a4ce4e149c6a43e4bec1e90f8/.github/workflows/ci.yml)
  copy-manifest-to-gar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [assemble]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Google Auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/868781662168/locations/global/workloadIdentityPools/prod-github/providers/github-oidc-pool
          service_account: gha-conduit-push@sac-prod-sa.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: ">= 390.0.0"

      - name: Configure Docker
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev
          gcloud auth configure-docker us-docker.pkg.dev

      - name: Copy manifest from GHCR to GAR
        run: |
          docker buildx imagetools create \
            --tag us-central1-docker.pkg.dev/sentryio/conduit/conduit:${{ github.sha }} \
            --tag us-central1-docker.pkg.dev/sentryio/conduit/conduit:latest \
            --tag us-docker.pkg.dev/sentryio/conduit-mr/conduit:${{ github.sha }} \
            --tag us-docker.pkg.dev/sentryio/conduit-mr/conduit:latest \
            ghcr.io/getsentry/conduit:${{ github.sha }}
