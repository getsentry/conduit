# Ignored by docker compose, used by devservices
x-sentry-service-config:
  version: 0.1
  service_name: conduit
  dependencies:
    redis-cluster:
      description: Conduit's redis cluster (broker)
    gateway:
      description: Conduit gateway service
    publish:
      description: Conduit publish service
    cleanup:
      description: Conduit cleanup service
  modes:
    default: [redis-cluster]
    containerized: [redis-cluster, gateway, publish, cleanup]

x-programs:
  devserver:
    command: sh -c 'cargo run --bin gateway & cargo run --bin publish & cargo run --bin cleanup'

services:
  gateway:
    image: ghcr.io/getsentry/conduit-gateway:dev
    environment:
      GATEWAY_PORT: ${GATEWAY_PORT:-9096}
      REDIS_URL: ${REDIS_URL:-redis://redis-cluster:7000}
      GATEWAY_JWT_ISSUER: ${GATEWAY_JWT_ISSUER:-dev.getsentry.net}
      GATEWAY_JWT_AUDIENCE: ${GATEWAY_JWT_AUDIENCE:-conduit}
      GATEWAY_JWT_PUBLIC_KEY: |-
        -----BEGIN PUBLIC KEY-----
        MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEApJI72zDCwwgaxuPGgvgT
        4L3jRwtl7LVWn6oQSWy+K5DX+Ui8N6oyHcr/5+LjfuvrJu+7gF3jes0KVfBRRX4/
        8T1J3n8Mw5FCGkaBXpRVreMQ/dXffycpythdYJNjva4rk4yFtFABOzRba5mrTSPT
        bDSFbVS/X/cQTY6SVlbIljEjn+/aAvs+882n7FsjAAn4lbs/A/J9NwZZz+5GYxi6
        no3STj6rEELVGzc3W36ZZslNLtWzE3WfRUJMyORZ5vyGigjV6bQ6+dqxOPwzqDsf
        +JliB2AMOQ26lHHNIkgDZFLSOejqwHMbKbCj0iSv1MrX4xcTlgw8yoisX74BE2Vs
        wQIDAQAB
        -----END PUBLIC KEY-----
    ports:
      - 127.0.0.1:9096:9096
    networks:
      - devservices
    extra_hosts:
      - host.docker.internal:host-gateway
    labels:
      - orchestrator=devservices
    healthcheck:
      test: curl -f http://127.0.0.1:9096/healthz
      interval: 5s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  publish:
    image: ghcr.io/getsentry/conduit-publish:dev
    environment:
      PUBLISH_PORT: ${PUBLISH_PORT:-9097}
      REDIS_URL: ${REDIS_URL:-redis://redis-cluster:7000}
      PUBLISH_JWT_ISSUER: ${PUBLISH_JWT_ISSUER:-dev.getsentry.net}
      PUBLISH_JWT_AUDIENCE: ${PUBLISH_JWT_AUDIENCE:-conduit}
      PUBLISH_JWT_SECRET: ${PUBLISH_JWT_SECRET:-conduit-dev-secret}
    ports:
      - 127.0.0.1:9097:9097
    networks:
      - devservices
    extra_hosts:
      - host.docker.internal:host-gateway
    labels:
      - orchestrator=devservices
    healthcheck:
      test: curl -f http://127.0.0.1:9097/healthz
      interval: 5s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  cleanup:
    image: ghcr.io/getsentry/conduit-cleanup:dev
    environment:
      CLEANUP_PORT: ${CLEANUP_PORT:-9098}
      REDIS_URL: ${REDIS_URL:-redis://redis-cluster:7000}
    ports:
      - 127.0.0.1:9098:9098
    networks:
      - devservices
    extra_hosts:
      - host.docker.internal:host-gateway
    labels:
      - orchestrator=devservices
    healthcheck:
      test: curl -f http://127.0.0.1:9098/healthz
      interval: 5s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  redis-cluster:
    image: ghcr.io/getsentry/docker-redis-cluster:7.0.10
    ports:
      - '127.0.0.1:7000:7000'
      - '127.0.0.1:7001:7001'
      - '127.0.0.1:7002:7002'
      - '127.0.0.1:7003:7003'
      - '127.0.0.1:7004:7004'
      - '127.0.0.1:7005:7005'
    networks:
      - devservices
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      - IP=0.0.0.0
    labels:
      - orchestrator=devservices

networks:
  devservices:
    name: devservices
    external: true
