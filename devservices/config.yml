# Ignored by docker compose, used by devservices
x-sentry-service-config:
  version: 0.1
  service_name: conduit
  dependencies:
    redis-cluster:
      description: Conduit's redis cluster (broker)
    gateway:
      description: Conduit gateway service
    publish:
      description: Conduit publish service
    cleanup:
      description: Conduit cleanup service
  modes:
    default: [redis-cluster]
    containerized: [redis-cluster, gateway, publish, cleanup]

x-programs:
  devserver:
    command: sh -c 'cargo run --bin gateway & cargo run --bin publish & cargo run --bin cleanup'

# The redis cluster announces its nodes as 127.0.0.1, so conduit services share
# the redis-cluster network namespace to reach them. Service ports are therefore
# published on the redis-cluster container.
services:
  gateway:
    image: ghcr.io/getsentry/conduit-gateway:dev
    network_mode: service:redis-cluster
    depends_on:
      - redis-cluster
    environment:
      GATEWAY_PORT: "9096"
      REDIS_URL: redis://127.0.0.1:7100
      GATEWAY_JWT_ISSUER: dev.getsentry.net
      GATEWAY_JWT_AUDIENCE: conduit
      GATEWAY_JWT_PUBLIC_KEY: |-
        -----BEGIN PUBLIC KEY-----
        MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEApJI72zDCwwgaxuPGgvgT
        4L3jRwtl7LVWn6oQSWy+K5DX+Ui8N6oyHcr/5+LjfuvrJu+7gF3jes0KVfBRRX4/
        8T1J3n8Mw5FCGkaBXpRVreMQ/dXffycpythdYJNjva4rk4yFtFABOzRba5mrTSPT
        bDSFbVS/X/cQTY6SVlbIljEjn+/aAvs+882n7FsjAAn4lbs/A/J9NwZZz+5GYxi6
        no3STj6rEELVGzc3W36ZZslNLtWzE3WfRUJMyORZ5vyGigjV6bQ6+dqxOPwzqDsf
        +JliB2AMOQ26lHHNIkgDZFLSOejqwHMbKbCj0iSv1MrX4xcTlgw8yoisX74BE2Vs
        wQIDAQAB
        -----END PUBLIC KEY-----
    labels:
      - orchestrator=devservices
    healthcheck:
      test: curl -f http://127.0.0.1:9096/readyz
      interval: 5s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  publish:
    image: ghcr.io/getsentry/conduit-publish:dev
    network_mode: service:redis-cluster
    depends_on:
      - redis-cluster
    environment:
      PUBLISH_PORT: "9097"
      REDIS_URL: redis://127.0.0.1:7100
      PUBLISH_JWT_ISSUER: dev.getsentry.net
      PUBLISH_JWT_AUDIENCE: conduit
      PUBLISH_JWT_SECRET: conduit-dev-secret
    labels:
      - orchestrator=devservices
    healthcheck:
      test: curl -f http://127.0.0.1:9097/readyz
      interval: 5s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  cleanup:
    image: ghcr.io/getsentry/conduit-cleanup:dev
    network_mode: service:redis-cluster
    depends_on:
      - redis-cluster
    environment:
      CLEANUP_PORT: "9098"
      REDIS_URL: redis://127.0.0.1:7100
    labels:
      - orchestrator=devservices
    healthcheck:
      test: curl -f http://127.0.0.1:9098/readyz
      interval: 5s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  redis-cluster:
    image: ghcr.io/getsentry/image-mirror-valkey-valkey:8.0.12
    command:
      - sh
      - -c
      - |
        rm -f nodes-*.conf
        for p in 7100 7101 7102; do
          valkey-server --port $$p --protected-mode no --cluster-enabled yes \
            --cluster-config-file nodes-$$p.conf --save '' &
        done
        for p in 7100 7101 7102; do until valkey-cli -p $$p ping >/dev/null 2>&1; do sleep 0.1; done; done
        valkey-cli --cluster create 127.0.0.1:7100 127.0.0.1:7101 127.0.0.1:7102 --cluster-yes
        wait
    ports:
      # Redis cluster nodes. Offset from 7000 to avoid colliding with Sentry's
      # own redis-cluster devservice.
      - '127.0.0.1:7100:7100'
      - '127.0.0.1:7101:7101'
      - '127.0.0.1:7102:7102'
      # Conduit services (gateway, publish, cleanup)
      - '127.0.0.1:9096:9096'
      - '127.0.0.1:9097:9097'
      - '127.0.0.1:9098:9098'
    healthcheck:
      test: ['CMD-SHELL', 'valkey-cli -p 7100 cluster info | grep -q cluster_state:ok']
      interval: 1s
      timeout: 3s
      retries: 30
    networks:
      devservices:
        aliases:
          - conduit-gateway
          - conduit-publish
          - conduit-cleanup
    extra_hosts:
      - host.docker.internal:host-gateway
    labels:
      - orchestrator=devservices

networks:
  devservices:
    name: devservices
    external: true
