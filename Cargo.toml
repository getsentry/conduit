[workspace]
members = [
  "services/cleanup",
  "services/gateway",
  "services/publish",
  "shared/broker", "shared/monitoring",
]
resolver = "2"

[workspace.package]
edition = "2024"

[workspace.dependencies]
sentry_protos = "0.97.0"
anyhow = "1.0.104"
async-stream = "0.3.6"
async-trait = "0.1.92"
axum = "0.8.9"
chrono = "0.4.45"
deadpool-redis = { version = "0.23.1", features = ["rt_tokio_1", "cluster"] }
futures = "0.3.34"
futures-util = "0.3.34"
http = "1.5.0"
redis = { version = "1.8.0", features = ["tokio-comp", "connection-manager", "cluster-async"] }
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
metrics-exporter-dogstatsd = "0.9.8"
metrics = "0.24.6"
mockall = "0.15.0"
prost = "0.14.4"
prost-types = "0.14.4"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1.19"
tokio-util = "0.7.20"
rand = "0.9"
rsa = "0.9.10"
thiserror = "2.0.21"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors"] }
sentry = { version = "0.49.5", features = [
    "backtrace",
    "contexts",
    "debug-images",
    "panic",
    "transport",
    "tracing",
    "logs",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
    "std",
    "env-filter",
    "json",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
dotenvy = "0.15.7"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
